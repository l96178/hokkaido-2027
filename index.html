<style>
/* VOICE everyday travel, calm and exact, read on a phone during the trip
   IDEA a JR Hokkaido route board: one map of the loop, today's line lit in signal red

:root{color-scheme:light;--bg:#ffffff;--ink:#0f2a3f;--mute:#567087;--sky:#1673c4;--ice:#eef7fd;--red:#d1362b;--line:#d3e6f4;--chip:#e2f1fc;--land:#fdfeff;--sea:#a8d5f4;--lab:#1c3346;--ok:#1f7a4d}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit}
.band{padding:clamp(24px,3.5vw,48px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.top{position:relative;overflow:hidden;color:var(--ink);padding-bottom:clamp(96px,11vw,140px);background:linear-gradient(180deg,#58afea 0%,#97cff5 55%,#dcf0fc 100%)}
.top>canvas.snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.top>.wrap{position:relative}
.hero{position:relative;z-index:1}
.peaks{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:clamp(80px,10vw,130px);display:block}
.hero{display:grid;gap:24px;align-items:center}
@media(min-width:880px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}
.top h1{font-weight:900;font-size:clamp(30px,4.6vw,48px);line-height:1.08;margin:0 0 10px;text-wrap:balance}
.top p{margin:0 0 14px;color:#173a55}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.facts li{background:rgba(255,255,255,.6);border-radius:10px;padding:6px 12px;font-size:15px}
.facts b{font-weight:700}
.big{background:var(--land);border-radius:18px;padding:6px;box-shadow:0 14px 34px rgba(20,90,150,.28)}
.big svg,.mini svg{display:block;width:100%;height:auto}
.tabs{display:flex;gap:8px;padding:10px max(5vw,16px);overflow-x:auto;scrollbar-width:thin;position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:box-shadow .2s}
.tabs.stuck{box-shadow:0 4px 14px rgba(20,90,150,.14)}
.tab .today{display:inline-block;margin-left:6px;font:700 12px/1 system-ui,sans-serif;background:var(--red);color:#fff;border-radius:6px;padding:3px 6px;vertical-align:4px}
.tab[aria-selected=true] .today{background:#fff;color:var(--red)}
.prog{font-size:16px;font-weight:700;color:var(--mute);margin-left:10px;white-space:nowrap}
.prog.all{color:var(--ok)}
.skl{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
.skl a{display:inline-block;background:var(--chip);border:1px solid #a8d3f2;border-radius:10px;padding:6px 12px;font-weight:700;text-decoration:none;color:var(--ink)}
.tab{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 14px;min-height:44px;cursor:pointer;text-align:left;line-height:1.25}
.tab b{display:block;font:700 22px "Barlow Semi Condensed",sans-serif;white-space:nowrap}
.tab span{font-size:13px;color:var(--mute);white-space:nowrap}
.tab[aria-selected=true]{background:var(--sky);border-color:var(--sky);color:#fff}
.tab[aria-selected=true] span{color:#dcefff}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.day{display:grid;gap:28px}
@media(min-width:900px){.day{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.day h2{font-weight:900;font-size:clamp(26px,3.4vw,36px);line-height:1.1;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 10px}

.list{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:4px 16px;padding:14px 0;border-top:1px solid var(--line)}

.it.none{color:var(--mute)}
.lk{display:inline;background:#e2f1fc;color:var(--ink);border:1px solid #a8d3f2;border-radius:8px;padding:1px 8px;cursor:pointer;font-weight:inherit;line-height:1.9;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.lk.first{margin-left:0}

.lk.cta{background:var(--sky);border-color:var(--sky);color:#fff;font-weight:700;padding:6px 12px;line-height:1.5}
.lk.cta::after{color:#fff}
.lk.cta:hover{background:#0f5fa6}
a[target=_blank]::after{content:'↗';font-size:.85em;margin-left:3px;color:var(--sky)}
.hint{font-size:14px;color:var(--mute);margin:-8px 0 12px}
.pill{display:inline-block;background:var(--sky);color:#fff;border:0;border-radius:999px;padding:6px 14px;min-height:36px;font-weight:700;cursor:pointer;margin-top:4px}
.card{background:var(--ice);border-radius:16px;padding:18px}
.card+.card{margin-top:16px}
.card h3{margin:0 0 8px;font-size:17px}
.mini{background:var(--land);border-radius:12px;overflow:hidden;margin:0 0 10px}
.legend{font-size:14px;color:var(--mute);margin:0 0 8px}
.gm{display:inline-block;font-weight:700;text-decoration:none;border-bottom:2px solid var(--sky)}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px}
dt{color:var(--mute);white-space:nowrap}
dd{margin:0;font-weight:500}
.card ul{margin:0;padding-left:1.2em}
.card li{margin:4px 0}
@media(min-width:900px){aside{position:sticky;top:12px;align-self:start}}
.todo{background:var(--ice)}
.todo h2{font-weight:900;font-size:clamp(24px,3vw,32px);margin:0 0 12px}
.chks{display:grid;gap:8px 20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,24em),1fr));list-style:none;margin:0;padding:0}
.chks li{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.st{flex:none;font-size:13px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--chip);white-space:nowrap}
.st.ok{background:var(--ok);color:var(--bg)}
.ph{margin:0 0 14px}.ph img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--ice)}.ph figcaption{font-size:12px;color:var(--mute);margin-top:4px;text-align:right}.ph figcaption a{color:inherit}.ph figcaption a[target=_blank]::after{content:''}
.chks li .tx{flex:1;min-width:0}
button.st{border:1px solid #a8d3f2;cursor:pointer;font-family:inherit;color:var(--ink)}
button.st.ok{border-color:var(--ok);color:#fff}
button.st:disabled{opacity:.6;cursor:wait}
.who{flex:none;font:inherit;font-size:14px;color:var(--ink);background:var(--ice);border:1px solid #a8d3f2;border-radius:8px;padding:2px 4px;width:6.2em;text-align:center;text-align-last:center}
.who.empty{color:var(--mute)}
.whot{flex:none;font-size:14px;color:var(--mute)}
.synch{font-size:14px;color:var(--mute);margin:-4px 0 12px}
.synch.err{color:var(--red)}
foot,.foot{display:block;color:var(--mute);font-size:14px}
dialog{border:0;border-radius:18px;padding:0;width:min(720px,94vw);max-height:88vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,20,32,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
.dh h3{margin:0;font-size:20px;font-weight:900}
.x{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-width:44px;min-height:44px;cursor:pointer;font-size:20px}
.db{padding:16px 20px 22px}
.db p{margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
thead th{background:var(--ice)}
tbody th{white-space:nowrap;color:var(--mute);font-weight:500}
td{white-space:pre-line}
.hl td{font-weight:700}
.grp{margin:22px 0 6px;font-size:18px;font-weight:900;color:var(--sky)}
.recs{list-style:none;padding:0;margin:0}
.recs li{padding:14px 0;border-top:1px solid var(--line)}
.recs p{margin:8px 0 6px}
.recs dl{font-size:15px;gap:4px 12px}
.recs .stn{color:var(--mute);font-size:14px}
.note{font-size:14px;color:var(--mute)}
svg text{font:500 18px "Noto Sans TC",sans-serif;fill:var(--lab);paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}
svg .sea{fill:var(--sea)}
svg .land{fill:var(--land)}
svg .rt{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
svg .rt.alt{stroke-width:3;stroke-dasharray:2 8;opacity:.8}
svg .rt.faint{stroke:var(--mute);stroke-width:2.5;opacity:.45}
svg .stop{fill:var(--land);stroke:var(--red);stroke-width:3}
svg .stop.dim{stroke:var(--mute)}
svg .mt{fill:var(--mute);opacity:.6}
svg .lk2 text{font-weight:700}
svg.metro text{font-size:17px}
svg .arw{fill:var(--red);stroke:var(--land);stroke-width:1.5}
svg .arw.alt{fill:var(--mute)}
svg .num{fill:var(--red);stroke:none;font:700 15px "Barlow Semi Condensed",sans-serif}
svg .ln{fill:none;stroke-width:7;stroke-linecap:round}
@media(prefers-reduced-motion:no-preference){.rt{stroke-dashoffset:0;transition:opacity .3s}}
@media(max-width:600px){.it{grid-template-columns:4.2em minmax(0,1fr);gap:4px 12px}.it .when b{font-size:18px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px}.stack td,.stack th{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--mute);font-weight:500}.stack tbody th{padding-inline-start:0;color:var(--ink);font-weight:900}}
</style>
</head>

      <ul class="facts">

<script>
{
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gq=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);

/* ---------- places on the drawn map ---------- */
const PL={
 cts:{n:'新千歲機場',lon:141.69,lat:42.79,l:[18,40,'end'],q:'新千歳空港'},
 spk:{n:'札幌',lon:141.35,lat:43.07,l:[12,-6,'start'],q:'SAPPORO HOTEL by GRANBELL 〒060-0906'},
 dbt:{n:'頭大佛',lon:141.39,lat:42.94,l:[12,6,'start'],q:'頭大仏殿'},
 jzk:{n:'定山溪',lon:141.16,lat:42.97,l:[-12,4,'end'],q:'定山渓温泉'},
 nkym:{n:'中山峠',lon:141.07,lat:42.87,l:[12,6,'start'],q:'道の駅 望羊中山'},
 silo:{n:'筒倉展望台',lon:140.80,lat:42.63,l:[-12,-6,'end'],q:'サイロ展望台'},
 villa:{n:'洞爺民宿',lon:140.76,lat:42.552,l:[-12,18,'end'],q:'TOYA Station Villa'},
 sktu:{n:'支笏湖',lon:141.41,lat:42.775,l:[12,-8,'start'],q:'支笏湖 山線鉄橋'},
 nbr:{n:'登別地獄谷',lon:141.15,lat:42.50,l:[12,6,'start'],q:'登別地獄谷'},
 rsts:{n:'留壽都',lon:140.90,lat:42.75,l:[12,6,'start'],q:'ルスツリゾート日帰り駐車場'},
 nsk:{n:'二世谷',lon:140.70,lat:42.86,l:[0,-14,'middle'],q:'ヒラフ第1駐車場 倶知安町'},
 kyg:{n:'京極',lon:140.88,lat:42.86,l:[8,26,'middle'],q:'京極ふきだし公園'},
 yti:{n:'余市',lon:140.79,lat:43.19,l:[0,26,'middle'],q:'余市駅'},
 otr:{n:'小樽',lon:141.00,lat:43.19,l:[0,26,'middle'],q:'小樽運河'},
 kh:{n:'',lon:141.57,lat:42.98,hide:1},
 tw:{n:'',lon:140.765,lat:42.62,hide:1},
 kz:{n:'',lon:140.665,lat:42.985,hide:1,q:'小沢駅 共和町'}
};
const W=600,H=590,L0=140.52,L1=141.82,A0=42.36,A1=43.30;
const P=(lon,lat)=>[(lon-L0)/(L1-L0)*W,(A1-lat)/(A1-A0)*H];
const pts=a=>a.map(([lo,la])=>P(lo,la).map(v=>v.toFixed(1)).join(',')).join(' ');
const north=[[140.52,43.30],[140.52,43.28],[140.64,43.27],[140.72,43.21],[140.79,43.198],[140.9,43.212],[141.0,43.198],[141.1,43.17],[141.2,43.15],[141.3,43.18],[141.42,43.24],[141.52,43.30]];
const bay=[[140.52,42.36],[140.52,42.575],[140.62,42.572],[140.70,42.575],[140.76,42.543],[140.82,42.50],[140.87,42.465],[140.93,42.42],[140.97,42.375],[140.975,42.36]];
const south=[[141.03,42.36],[141.05,42.38],[141.10,42.415],[141.20,42.47],[141.35,42.545],[141.50,42.60],[141.60,42.63],[141.82,42.62],[141.82,42.36]];
const ell=(lon,lat,rl,ra)=>{const [x,y]=P(lon,lat);return `<ellipse class="sea" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(rl/(L1-L0)*W).toFixed(1)}" ry="${(ra/(A1-A0)*H).toFixed(1)}"/>`};
const base=()=>{const [yx,yy]=P(140.81,42.83);return `<rect class="land" width="${W}" height="${H}"/><polygon class="sea" points="${pts(north)}"/><polygon class="sea" points="${pts(bay)}"/><polygon class="sea" points="${pts(south)}"/>${ell(140.85,42.60,0.075,0.045)}${ell(141.33,42.77,0.08,0.035)}<polygon class="mt" points="${yx},${yy-16} ${yx-16},${yy+10} ${yx+16},${yy+10}"/><text x="${yx-22}" y="${yy+8}" text-anchor="end" style="font-size:16px">羊蹄山</text><text x="${P(140.66,42.44)[0]}" y="${P(140.66,42.44)[1]}" style="font-size:16px;fill:var(--mute)">內浦灣</text><text x="${P(141.12,43.27)[0]}" y="${P(141.12,43.27)[1]}" style="font-size:16px;fill:var(--mute)">石狩灣</text><text x="${P(140.86,42.585)[0]}" y="${P(140.86,42.585)[1]}" style="font-size:15px;fill:var(--mute)" text-anchor="middle">洞爺湖</text>`};
const arrows=(keys,cls)=>{let o='';for(let i=1;i<keys.length;i++){const [x1,y1]=P(PL[keys[i-1]].lon,PL[keys[i-1]].lat),[x2,y2]=P(PL[keys[i]].lon,PL[keys[i]].lat);if(Math.hypot(x2-x1,y2-y1)<30)continue;const a=Math.atan2(y2-y1,x2-x1)*180/Math.PI,mx=(x1+x2)/2,my=(y1+y2)/2;o+=`<path class="arw ${cls||''}" d="M9 0L-7 -7.5L-3 0L-7 7.5Z" transform="translate(${mx.toFixed(1)},${my.toFixed(1)}) rotate(${a.toFixed(1)})"/>`}return o};
const line=(keys,cls)=>`<polyline class="rt ${cls||''}" points="${keys.map(k=>P(PL[k].lon,PL[k].lat).map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`+(cls==='faint'?'':arrows(keys,cls));
const stops=(keys,dim,seq)=>{const sq=(seq||[]).filter(k=>!PL[k].hide);return [...new Set(keys)].filter(k=>!PL[k].hide).map(k=>{const p=PL[k],[x,y]=P(p.lon,p.lat),n=sq.indexOf(k)+1,g=n?6:0,dx=p.l[0]+Math.sign(p.l[0])*g,dy=p.l[2]==='middle'?p.l[1]+Math.sign(p.l[1])*g:p.l[1];return (n?`<circle class="stop" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12"/><text class="num" x="${x.toFixed(1)}" y="${(y+5.5).toFixed(1)}" text-anchor="middle">${n}</text>`:`<circle class="stop ${dim&&!dim.has(k)?'dim':''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>`)+`<text x="${(x+dx).toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${p.l[2]}">${esc(p.n)}</text>`}).join('')};
function drawMap(svg,routes){
  const main=routes.filter(r=>!r.cls),on=new Set(main.flatMap(r=>r.k));
  const all=routes.flatMap(r=>r.k);
  svg.innerHTML=base()+routes.filter(r=>r.cls).map(r=>line(r.k,r.cls)).join('')+main.map(r=>line(r.k)).join('')+stops(all,on,main.length?main[0].k:[]);
}

/* ---------- rich text: [[key|text]] ---------- */
const rich=s=>esc(s).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,(m,k,t,o,all)=>{
  k=k.replace(/&amp;/g,'&');
  if(k.startsWith('http'))return `<a href="${esc(k)}" target="_blank" rel="noopener">${t}</a>`;
  const P='（）：、，。「」',nx=all[o+m.length],pv=all[o-1];
  const c=(o===0||P.includes(pv)?' first':'')+(o+m.length===all.length||P.includes(nx)?' last':'');
  return `<button class="lk${c}" data-open="${esc(k)}">${t}</button>`;});

const gdir=keys=>{const q=keys.filter(k=>PL[k].q).map(k=>PL[k].q),o=q[0],d=q[q.length-1],w=q.slice(1,-1);return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+encodeURIComponent(o)+'&destination='+encodeURIComponent(d)+(w.length?'&waypoints='+encodeURIComponent(w.join('|')):'')};

function drawOverview(){
  const ov=document.getElementById('overview');
  const routes=[];D.forEach((x,i)=>{if(x.alt){const o=alt==='A'?'B':'A';routes.push({k:x.alt[o].r,cls:i===cur?'alt':'faint'},{k:x.alt[alt].r,cls:i===cur?'':'faint'})}else if(x.r)routes.push({k:x.r[0].k,cls:i===cur?'':'faint'})});
  const main=routes.filter(r=>!r.cls),on=new Set(main.flatMap(r=>r.k));
  ov.innerHTML=base()+routes.filter(r=>r.cls).map(r=>line(r.k,r.cls)).join('')+main.map(r=>line(r.k)).join('')+stops(Object.keys(PL),on.size?on:new Set(['spk']),main.length?main[0].k:[]);
}

}

// 出發前要訂：狀態和「誰訂」存在 Google 試算表（Apps Script 網頁應用程式）
const API='https://script.google.com/macros/s/AKfycbxqUOJPbWbdBFF4O4x8N8t58ri71PzDN9bU3wFeDk1lg7oK43AHtRZGRJK6XWzmJqW2WQ/exec';
const WHO=['各自訂','許','安格斯','Ryan','襄','小砆','小王','大鈞','鈞伴'];
const tkey=t=>t.replace(/\[\[[^|\]]*\|([^\]]*)\]\]/g,'$1').slice(0,6);
const TS=TODO.map(([ok,t])=>({t,key:tkey(t),done:!!ok,who:''}));
let live=false;
const todoEl=document.getElementById('todo'),synch=document.getElementById('synch');
const note=(m,err)=>{synch.hidden=!m;synch.textContent=m||'';synch.classList.toggle('err',!!err)};
const drawTodo=()=>{const nd=TS.filter(x=>x.done).length,pg=document.getElementById('prog');pg.textContent=`已訂 ${nd}／${TS.length}`;pg.classList.toggle('all',nd===TS.length);todoEl.innerHTML=TS.map((x,i)=>live
  ?`<li><button class="st ${x.done?'ok':''}" data-k="${i}" aria-label="切換訂位狀態">${x.done?'已訂':'待訂'}</button><span class="tx">${rich(x.t)}</span><select class="who ${x.who?'':'empty'}" data-k="${i}" aria-label="誰訂"><option value="">誰訂？</option>${WHO.map(n=>`<option${n===x.who?' selected':''}>${esc(n)}</option>`).join('')}</select></li>`
  :`<li><span class="st ${x.done?'ok':''}">${x.done?'已訂':'待訂'}</span><span class="tx">${rich(x.t)}</span>${x.who?`<span class="whot">${esc(x.who)}</span>`:''}</li>`).join('')};
const merge=items=>{for(const it of items||[]){const x=TS.find(y=>y.key===String(it.text).slice(0,6));if(x){x.done=!!it.done;x.who=it.who||''}}};
const save=async(i,patch)=>{const x=TS[i],old={done:x.done,who:x.who};Object.assign(x,patch);drawTodo();note('儲存中…');
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:x.key,...patch})});const j=await r.json();if(j.error)throw new Error(j.error);merge(j.items);drawTodo();note('已存檔，大家看到的是同一份。')}
  catch(e){Object.assign(x,old);drawTodo();note('沒有存成功，請稍後再試。',true)}};
todoEl.addEventListener('click',e=>{const b=e.target.closest('button.st[data-k]');if(b){const i=+b.dataset.k;save(i,{done:!TS[i].done})}});
todoEl.addEventListener('change',e=>{const s=e.target.closest('select.who');if(s)save(+s.dataset.k,{who:s.value})});
drawTodo();
if(API){note('讀取最新狀態…');fetch(API).then(r=>r.json()).then(j=>{merge(j.items);live=true;drawTodo();note('點「待訂／已訂」可以切換，右邊選誰訂，大家看到的是同一份。')}).catch(()=>note('讀不到最新狀態，下面是之前的紀錄。',true))}

const fromHash=()=>{const h=location.hash.slice(1);const i=D.findIndex(x=>hid(x)===h);return i<0?(todayIdx<0?0:todayIdx):i};
window.addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)go(i)});
go(fromHash());
new IntersectionObserver(e=>tabs.classList.toggle('stuck',!e[0].isIntersecting),{rootMargin:'-1px 0px 0px 0px'}).observe(document.querySelector('header.top'));
}

<script>
// 標題區的飄雪：遠近三層、大小快慢不同、左右飄動，畫面外或分頁在背景時暫停
(()=>{const top=document.querySelector('.top'),cv=top&&top.querySelector('canvas.snow');if(!cv||!cv.getContext)return;
const cx=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,dpr=1,F=[],run=false,seen=true,last=0,wind=0,windT=0;
const mk=(y)=>{const z=Math.random();const d=z<.55?0:z<.88?1:2; // 0 遠 1 中 2 近
  const r=[.7+Math.random()*.9,1.4+Math.random()*1.2,2.4+Math.random()*1.8][d];
  return {x:Math.random()*W,y:y??Math.random()*H,r,d,vy:[14,26,42][d]*(.8+Math.random()*.4),amp:[6,12,20][d]*(.5+Math.random()),ph:Math.random()*6.28,fq:.4+Math.random()*.8,a:[.45,.7,.85][d]*(.7+Math.random()*.3)}};
const size=()=>{const b=top.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=b.width;H=b.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.min(220,Math.round(W*H/5200));while(F.length<n)F.push(mk());F.length=n;F.forEach(f=>{if(f.x>W)f.x=Math.random()*W;if(f.y>H)f.y=Math.random()*H})};
const draw=t=>{cx.clearRect(0,0,W,H);for(const f of F){const x=f.x+Math.sin(t*f.fq+f.ph)*f.amp;
  if(f.d===2){const g=cx.createRadialGradient(x,f.y,0,x,f.y,f.r*1.6);g.addColorStop(0,`rgba(255,255,255,${f.a})`);g.addColorStop(.55,`rgba(255,255,255,${f.a*.6})`);g.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,f.y,f.r*1.6,0,6.283);cx.fill()}
  else{cx.fillStyle=`rgba(255,255,255,${f.a})`;cx.beginPath();cx.arc(x,f.y,f.r,0,6.283);cx.fill()}}};
const step=now=>{if(!run)return;const dt=Math.min(.05,(now-(last||now))/1000);last=now;const t=now/1000;
  windT+=dt;wind=Math.sin(windT*.15)*10+Math.sin(windT*.37)*5;
  for(const f of F){f.y+=f.vy*dt;f.x+=wind*(.4+f.d*.3)*dt;if(f.y-f.r*2>H){Object.assign(f,mk(-f.r*2))}if(f.x<-30)f.x+=W+60;else if(f.x>W+30)f.x-=W+60}
  draw(t);requestAnimationFrame(step)};
const sync=()=>{const want=seen&&!document.hidden&&!still;if(want&&!run){run=true;last=0;requestAnimationFrame(step)}else if(!want)run=false};
size();draw(0);
new ResizeObserver(()=>{size();if(!run)draw(performance.now()/1000)}).observe(top);
new IntersectionObserver(e=>{seen=e[0].isIntersecting;sync()}).observe(top);
document.addEventListener('visibilitychange',sync);sync()})();
</script>
